<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDIT — plateforme de jeu</title>
<meta name="description" content="EDIT, jeu de placement de cartes Plans dans un banc de montage. Plateforme de jeu et laboratoire d'équilibrage — Big Budi Games.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%237c3aed'/><rect x='34' y='6' width='24' height='24' rx='6' fill='%23f97316'/><rect x='6' y='34' width='24' height='24' rx='6' fill='%23f59e0b'/></svg>">
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------------
// Amorçage — volontairement sans numéro de version en dur
// ---------------------------------------------------------------------------
// Ce fichier ne cite aucune version : il demande d'abord au serveur laquelle
// est publiée, puis construit l'adresse du module principal à partir de cette
// réponse. Même servi depuis le cache, il charge donc toujours la dernière
// version du code — c'est ce qui casse définitivement les mises en page
// périmées.

(async () => {
  // La feuille de style est chargée par le <link> ci-dessus, sans version :
  // on la ré-estampille dès qu'on connaît la version publiée.
  const stampCss = (v) => {
    const l = document.querySelector('link[rel=stylesheet]');
    if (l) l.href = `css/styles.css?v=${v}`;
  };

  let version = null;
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (r.ok) version = (await r.json()).version;
  } catch { /* hors ligne : on chargera la dernière copie connue */ }

  if (version) stampCss(version);
  const url = version ? `./js/app.js?v=${version}` : './js/app.js';

  try {
    await import(url);
  } catch (e) {
    // Dernier recours : sans la version, on tente le module nu.
    if (version) { try { await import('./js/app.js'); } catch { throw e; } } else throw e;
  }

  // Le service worker force ensuite chaque fichier à repasser par le réseau.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  }
})();
</script>
</body>
</html>
