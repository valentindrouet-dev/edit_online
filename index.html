<body>
<div id="app"></div>
<script>
// Le service worker force chaque fichier à repasser par le réseau : plus de
// version périmée au rafraîchissement. updateViaCache: 'none' évite que le
// worker lui-même reste coincé en cache.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
<script type="module" src="js/app.js"></script>
</body>
